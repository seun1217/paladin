name: Deploy to GitHub Pages

# 기본 브랜치에 푸시될 때(데이터 갱신 커밋 포함) 정적 사이트를 GitHub Pages 로 배포한다.
# 저장소 Settings > Pages > Build and deployment > Source 를 "GitHub Actions" 로 설정해야 한다.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html css js data vendor _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
